# nginx server block for ruben-tanner.uk
#
# Cloudflare sits in front and terminates TLS for visitors. If nginx also
# terminates TLS (Full or Full (strict) mode), add the listen 443 / ssl_*
# lines from the existing config; nothing below depends on them.
#
# Deploy: copy the repo's public/ directory to /var/www/ruben-tanner.uk/public
# (rsync -a --delete public/ user@vps:/var/www/ruben-tanner.uk/public/),
# then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name ruben-tanner.uk www.ruben-tanner.uk;

    root /var/www/ruben-tanner.uk/public;
    index index.html;
    charset utf-8;

    # Old blog URLs from the 2025 site. The blog is gone; send people home.
    location = /blog { return 301 /; }
    location ^~ /blog/ { return 301 /; }

    # Clean URLs: /foo serves /foo.html if it exists. Missing pages get the
    # real 404 page with a real 404 status.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Caching. Assets are not fingerprinted, so keep CSS and JS short-lived
    # and let fonts and images sit for longer. HTML always revalidates.
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(woff2|png|ico|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ruben-tanner.uk.access.log;
    error_log /var/log/nginx/ruben-tanner.uk.error.log;
}
