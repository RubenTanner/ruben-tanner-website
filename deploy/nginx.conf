# nginx server block for ruben-tanner.uk
#
# Cloudflare sits in front and terminates TLS for visitors. If nginx also
# terminates TLS (Full or Full (strict) mode), add the listen 443 / ssl_*
# lines from the existing config; nothing below depends on them.
#
# The site runs as a PM2 process (ecosystem.config.js, app name
# "ruben-tanner.uk") — a zero-dependency Node server, not a static root —
# so nginx reverse-proxies to it rather than reading public/ off disk.
# The PORT below must match the PORT in ecosystem.config.js.

server {
    listen 80;
    listen [::]:80;
    server_name ruben-tanner.uk www.ruben-tanner.uk;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ruben-tanner.uk.access.log;
    error_log /var/log/nginx/ruben-tanner.uk.error.log;
}
